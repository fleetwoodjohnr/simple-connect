name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  independent-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: cargo test -p simple-connect-core --features independent-ssh --test independent_it --locked -- --ignored
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux, arch: x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, platform: linux, arch: aarch64 }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, platform: windows, arch: x86_64 }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, platform: windows, arch: aarch64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, platform: darwin, arch: x86_64 }
          - { os: macos-15, target: aarch64-apple-darwin, platform: darwin, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - name: Verify native runner architecture
        run: |
          python -c "import subprocess; assert 'host: ${{ matrix.target }}' in subprocess.check_output(['rustc', '-vV'], text=True)"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xvfb xauth rpm
      - run: npm ci
      - run: node scripts/check-version.mjs
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-openssh.ps1 -Architecture '${{ matrix.arch }}'
      - run: npm test
      - run: node --test scripts/release-manifest.node.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: npm audit --omit=dev --audit-level=high
      - name: Build CI-only updater rehearsal example
        run: cargo build -p simple-connect --example update_rehearsal --locked
      - run: npm run tauri build -- --target ${{ matrix.target }} -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Smoke test installed package
        run: python scripts/package-smoke.py --bundle target/${{ matrix.target }}/release/bundle --arch ${{ matrix.arch }} --logs target/smoke-logs --harness-dir target/debug/examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/smoke-logs
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            target/${{ matrix.target }}/release/bundle/**/*.sig
  audit:
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: cargo test -p simple-connect-core --test ssh_it --test sftp_it --test app_it --test desktop_it --locked -- --ignored --test-threads=4
  publish:
    needs: [build, integration, independent-integration, audit]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: '{linux,windows,darwin}-*'
      - run: node scripts/release-manifest.mjs release-artifacts
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: |
            release-artifacts/latest.json
            release-artifacts/SHA256SUMS
      - if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Simple Connect $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          find release-artifacts -type f -print0 | xargs -0 -n 1 gh release upload "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false --latest
