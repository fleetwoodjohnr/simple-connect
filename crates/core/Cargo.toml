[package]
name = "simple-connect-core"
description = "Security-critical core of Simple Connect: validation, OpenSSH orchestration, SFTP, secrets."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
regex = "1"
dirs = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["process", "io-util", "net", "sync", "time", "rt", "macros", "fs"] }
portable-pty = "0.9"
base64 = "0.22"
sha2 = "0.10"
secrecy = "0.10"
zeroize = "1"
getrandom = "0.3"
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
keyring-core = "1"
openssh-sftp-client = "0.15"
futures-util = "0.3"
bytes = "1"
trash = "5"
if-addrs = "0.15"
dns-lookup = "4"
# VNC sign-in (VNC password: DES; Apple Remote Desktop: DH + MD5 + AES-128).
des = "0.8"
aes = "0.8"
md-5 = "0.10"
num-bigint = "0.4"
# RDP (memory-safe, decoded in the backend).
ironrdp-connector = "0.10"
ironrdp-session = "0.11"
ironrdp-graphics = "0.9"
ironrdp-pdu = "0.9"
ironrdp-core = { version = "0.2", features = ["alloc"] }
ironrdp-svc = "0.8"
ironrdp-dvc = "0.8"
ironrdp-displaycontrol = "0.8"
ironrdp-cliprdr = "0.7"
ironrdp-input = "0.7"
ironrdp-bulk = "0.1"
ironrdp-tokio = "0.10"
# TLS for RDP. Not ironrdp-tls: it honours SSLKEYLOGFILE, which would write session keys to disk.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time"] }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust D-Bus: no libdbus build dependency.
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
zbus = "5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDistributedNotificationCenter", "NSNotification", "NSOperation", "NSRunLoop", "NSString", "block2"] }

# Stand-in for the app binary in integration tests: ssh re-executes it as
# askpass / KnownHostsCommand, and it forwards to the test's helper server.
[[bin]]
name = "sc-test-helper"
path = "tests/support/helper_bin.rs"
test = false
doc = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
